# =============================================================================
#  Build OpenWrt Firmware (Private)
# -----------------------------------------------------------------------------
#  使用自建 self-hosted runner 构建，构建依赖已预装在机器上。
#  - 设备：x86-64 / x86-generic / x86-geode / x86-legacy / rockchip-armv8
#  - 版本：选择 24 或 25，自动检测官方最新版
#  - 插件：勾选式选择，自动带主包 + 汉化 + 依赖
#  - PPPoE：仓库 Secrets 配置 PPPOE_ACCOUNT / PPPOE_PASSWORD
# =============================================================================

name: Build OpenWrt Firmware (Private)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择目标设备架构'
        required: true
        type: choice
        default: 'x86-64'
        options:
          - 'x86-64'
          - 'x86-generic'
          - 'x86-geode'
          - 'x86-legacy'
          - 'rockchip-armv8'
      series:
        description: '选择 OpenWrt 系列（24=24.10 ipk / 25=25.12 apk）'
        required: true
        type: choice
        default: '25'
        options:
          - '24'
          - '25'
      profile:
        description: '设备 PROFILE（x86 用 generic；rockchip 填型号如 friendlyarm_nanopi-r4s）'
        required: false
        default: 'generic'
      custom_router_ip:
        description: "设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      rootfs_partsize:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      root_password:
        description: '设置固件 root 密码（留空则保持默认空密码）'
        required: false
        type: string
        default: ''
      plugins:
        description: '选择要安装的插件（可多选）'
        required: false
        type: string
        default: ''
      packages:
        description: '自定义额外插件（空格分隔，如 luci-app-openclash luci-app-passwall）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve plugins
        id: plugins
        shell: bash
        run: |
          PLUGINS="${{ inputs.plugins }}"
          NAMES=""
          PKGS=""
          if echo "$PLUGINS" | grep -q 'pkg_argon'; then
            PKGS="$PKGS luci-app-argon-config luci-theme-argon luci-i18n-argon-config-zh-cn"
            NAMES="$NAMES Argon 主题 + 配置"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_aurora'; then
            PKGS="$PKGS luci-app-aurora-config luci-theme-aurora luci-i18n-aurora-config-zh-cn"
            NAMES="$NAMES Aurora 主题 + 配置"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_kucat'; then
            PKGS="$PKGS luci-app-kucat-config luci-theme-kucat luci-i18n-kucat-config-zh-cn"
            NAMES="$NAMES Kucat 主题 + 配置"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_design'; then
            PKGS="$PKGS luci-theme-design"
            NAMES="$NAMES Design 主题"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_shadcn'; then
            PKGS="$PKGS luci-theme-shadcn"
            NAMES="$NAMES Shadcn 主题"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_mosdns'; then
            PKGS="$PKGS luci-app-mosdns mosdns v2ray-geoip v2ray-geosite v2dat luci-i18n-mosdns-zh-cn"
            NAMES="$NAMES MosDNS（DNS 转发）"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_homeproxy'; then
            PKGS="$PKGS luci-app-homeproxy sing-box luci-i18n-homeproxy-zh-cn"
            NAMES="$NAMES HomeProxy（代理）"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_diskman'; then
            PKGS="$PKGS luci-app-diskman luci-i18n-diskman-zh-cn"
            NAMES="$NAMES 磁盘管理"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_openlist2'; then
            PKGS="$PKGS luci-app-openlist2 luci-i18n-openlist2-zh-cn"
            NAMES="$NAMES OpenList2（导航）"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_ramfree'; then
            PKGS="$PKGS luci-app-ramfree luci-i18n-ramfree-zh-cn"
            NAMES="$NAMES 内存清理"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_airconnect'; then
            PKGS="$PKGS luci-app-airconnect luci-i18n-airconnect-zh-cn"
            NAMES="$NAMES AirConnect（AirPlay）"
          fi
          if echo "$PLUGINS" | grep -q 'pkg_bandix'; then
            PKGS="$PKGS luci-app-bandix-plus luci-i18n-bandix-plus-zh-cn"
            NAMES="$NAMES Bandix Plus（测速）"
          fi
          # 追加自定义包
          if [ -n "${{ inputs.packages }}" ]; then
            PKGS="$PKGS ${{ inputs.packages }}"
            NAMES="$NAMES ${{ inputs.packages }}"
          fi
          echo "pkgs=${PKGS}" >> "$GITHUB_OUTPUT"
          echo "names=${NAMES}" >> "$GITHUB_OUTPUT"

      - name: Resolve rootfs size
        id: rootfs
        shell: bash
        run: |
          case "${{ inputs.rootfs_partsize }}" in
            1G) SIZE=1024 ;;
            2G) SIZE=2048 ;;
            3G) SIZE=3072 ;;
            4G) SIZE=4096 ;;
          esac
          echo "size=${{ SIZE }}" >> "$GITHUB_OUTPUT"

      - name: Build OpenWrt firmware with ImageBuilder
        id: build
        uses: MinimaxFlora/gh-action-imagebuilder@v7.3
        with:
          arch: ${{ inputs.arch }}
          version: ${{ inputs.series }}
          profile: ${{ inputs.profile }}
          rootfs_partsize: ${{ steps.rootfs.outputs.size }}
          lan_ip: ${{ inputs.custom_router_ip }}
          packages: ${{ steps.plugins.outputs.pkgs }}
          root_password: ${{ inputs.root_password }}
          pppoe_account: ${{ secrets.PPPOE_ACCOUNT }}
          pppoe_password: ${{ secrets.PPPOE_PASSWORD }}

      - name: Create info
        env:
          ROOT_PASSWORD: ${{ inputs.root_password }}
        run: |
          if [ -n "$ROOT_PASSWORD" ]; then
            PASSWORD="$ROOT_PASSWORD"
          else
            PASSWORD="无（默认空密码）"
          fi
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          | 项目 | 值 |
          | :--- | :--- |
          | 🖥️ 设备架构 | ${{ inputs.arch }} |
          | ✳️ PROFILE | ${{ inputs.profile }} |
          | 🏠 后台地址 | ${{ inputs.custom_router_ip }} |
          | 👤 用户名 | root |
          | 🔑 密码 | ${PASSWORD} |
          | 📦 OpenWrt 系列 | ${{ inputs.series }} |
          EOF

          NAMES="${{ steps.plugins.outputs.names }}"
          if [ -n "$NAMES" ]; then
            echo "" >> ${{ github.workspace }}/router-info.md
            echo "## 🧩 已选插件" >> ${{ github.workspace }}/router-info.md
            echo "" >> ${{ github.workspace }}/router-info.md
            for p in $NAMES; do
              echo "- $p" >> ${{ github.workspace }}/router-info.md
            done
          fi

      - name: Upload firmware as release assets
        uses: MinimaxFlora/action-gh-release@v1.0
        with:
          tag_name: Private-${{ inputs.arch }}
          name: OpenWrt-${{ inputs.arch }}-${{ inputs.series }}-Private
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ steps.build.outputs.firmware_dir }}/**/*.img.gz
            ${{ steps.build.outputs.firmware_dir }}/**/*.bin
