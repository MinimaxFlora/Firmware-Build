# =============================================================================
#  Build OpenWrt Firmware（GitHub 托管 runner）
# -----------------------------------------------------------------------------
#  真正的构建逻辑在 .github/workflows/_firmware-build.yml（可复用流程），
#  这里只负责对外的输入表单，方便和 self-hosted 版本共用一套逻辑。
#
#  - 设备：x86-64 / x86-generic / x86-geode / x86-legacy / rockchip-armv8
#  - 系列：24（opkg/ipk）或 25（apk），自动取该系列最新稳定版
#  - 插件：Extras_Paclages（24→ipk 分支，25→apk 分支）里已发布的包
#  - PPPoE：Secrets 里配 PPPOE_ACCOUNT / PPPOE_PASSWORD（都配才启用）
# =============================================================================

name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择目标设备架构'
        required: true
        type: choice
        default: 'x86-64'
        options:
          - 'x86-64'
          - 'x86-generic'
          - 'x86-geode'
          - 'x86-legacy'
          - 'rockchip-armv8'
      series:
        description: '选择 OpenWrt 系列（24=24.10 ipk / 25=25.12 apk）'
        required: true
        type: choice
        default: '25'
        options:
          - '24'
          - '25'
      profile:
        description: '设备 PROFILE（x86 用 generic；rockchip 填型号如 friendlyarm_nanopi-r4s）'
        required: false
        default: 'generic'
      custom_router_ip:
        description: '默认管理地址（格式 192.168.x.1 / 10.x.x.1）'
        required: true
        default: '192.168.100.1'
      rootfs_partsize:
        description: '软件包分区大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      web_server:
        description: 'Web 服务器：uhttpd（默认）或 nginx（luci-app-quickfile 需要 nginx）'
        required: true
        type: choice
        default: 'uhttpd'
        options:
          - 'uhttpd'
          - 'nginx'
      theme:
        description: 'LuCI 主题'
        required: true
        type: choice
        default: 'argon'
        options:
          - 'argon'
          - 'vantage'
          - 'aurora'
          - 'design'
          - 'shadcn'
          - 'fluent'
      packages:
        description: '额外插件（空格分隔，必须是 Extras_Paclages 里已发布的包）'
        required: false
        type: string
        default: ''
      root_password:
        description: '固件 root 密码（留空=空密码；设置后不发布 Release，只留在 artifact）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: firmware-${{ inputs.arch }}-${{ inputs.series }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware
    uses: ./.github/workflows/_firmware-build.yml
    with:
      arch: ${{ inputs.arch }}
      series: ${{ inputs.series }}
      profile: ${{ inputs.profile }}
      lan_ip: ${{ inputs.custom_router_ip }}
      rootfs_partsize: ${{ inputs.rootfs_partsize }}
      web_server: ${{ inputs.web_server }}
      theme: ${{ inputs.theme }}
      packages: ${{ inputs.packages }}
      root_password: ${{ inputs.root_password }}
      tag_prefix: Autobuild
      runs_on: ubuntu-24.04
      install_deps: true
    secrets: inherit
